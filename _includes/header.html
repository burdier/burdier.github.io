<header class="header">
  <a class="header_avatar" href="{{ '/' | relative_url }}" aria-label="Ir al inicio">
    <img src="{{ site.user.pic | relative_url }}" alt="{{ site.user.picAlt }}">
  </a>

  <div class="header_identity">
    <h1 class="header_name"><a href="{{ '/' | relative_url }}">{{ site.user.name }}</a></h1>
    <p class="header_job">{{ site.description }}</p>
  </div>

  <nav class="nav" aria-label="Navegación principal">
    <a href="{{ '/' | relative_url }}">Artículos</a>
    {% if site.user.aboutme %}
    <a href="{{ '/aboutme.html' | relative_url }}">About</a>
    {% endif %}
    {% for category in site.categories %}
      {% capture cat_name %}{{ category | first }}{% endcapture %}
      <a href="{{ '/categories/' | append: cat_name | append: '.html' | relative_url }}">{{ cat_name }}</a>
    {% endfor %}
  </nav>
</header>
