<script src="{{ '/assets/js/colibri.js' | relative_url }}" defer></script>
<script>
// @license magnet:?xt=urn:btih:d3d9a9a6595521f9666a5e94cc830dab83b65699&dn=expat.txt Expat
document.addEventListener('DOMContentLoaded', () => {
  if (window.hljs) window.hljs.highlightAll();

  const html = document.documentElement;
  const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  const storedTheme = localStorage.getItem('theme');
  html.classList.toggle('dark', storedTheme ? storedTheme === 'dark' : prefersDark);
  html.classList.toggle('light', storedTheme ? storedTheme === 'light' : !prefersDark);

  const stats = document.querySelector('#stats');
  if (stats) {
    const request = new XMLHttpRequest();
    request.addEventListener('load', function () {
      try {
        const data = JSON.parse(this.responseText);
        stats.innerText = data.count;
      } catch (_) {
        stats.innerText = '—';
      }
    });
    request.open('GET', 'https://don3b.goatcounter.com/counter/' + encodeURIComponent('TOTAL') + '.json');
    request.send();
  }

  const fraseTexto = document.getElementById('frase-texto');
  const likeBtn = document.getElementById('like-btn');
  const likeCount = document.getElementById('like-count');
  const seguirBtn = document.getElementById('seguir-btn');

  if (fraseTexto && likeBtn && likeCount && seguirBtn) {
    const csvUrl = '{{ "/assets/frases_neutras.csv" | relative_url }}';
    fetch(csvUrl)
      .then(response => response.text())
      .then(csv => {
        const lines = csv.trim().split('\n').slice(1);
        if (!lines.length) return;
        const randomId = Math.floor(Math.random() * lines.length);
        const fraseLine = lines[randomId];
        const [id, text, likes] = fraseLine.split(',');
        const likeKey = `like_frase_${id || randomId}`;
        let currentLikes = parseInt(localStorage.getItem(likeKey) || likes || '0', 10);

        fraseTexto.textContent = text || 'La reflexión continúa...';
        likeCount.textContent = `${currentLikes} ❤️`;

        likeBtn.addEventListener('click', () => {
          currentLikes += 1;
          localStorage.setItem(likeKey, currentLikes);
          likeCount.textContent = `${currentLikes} ❤️`;
          likeBtn.disabled = true;
        });

        seguirBtn.addEventListener('click', () => {
          const mensajes = ['La reflexión continúa...', 'Profundizando...', 'Explorando ideas...', 'Siguiendo el hilo...'];
          seguirBtn.querySelector('.texto').textContent = mensajes[Math.floor(Math.random() * mensajes.length)];
          window.setTimeout(() => window.location.reload(), 900);
        });
      })
      .catch(() => {
        fraseTexto.textContent = 'No se pudo cargar la frase.';
      });
  }
});
// @license-end
</script>
